<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebImage Optimizer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#18202b;--mu:#5d6b7c;--bd:#d9dfe6;--ac:#0e7c86;--ac2:#e6f4f5;--ok:#157a3d;--wa:#a35a00;--er:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10151b;--card:#18202a;--tx:#e8edf3;--mu:#93a1b3;--bd:#2a3542;--ac:#38b6c1;--ac2:#14313a;--ok:#4cc27a;--wa:#e0a043;--er:#f08a80}}
:root[data-theme=dark]{--bg:#10151b;--card:#18202a;--tx:#e8edf3;--mu:#93a1b3;--bd:#2a3542;--ac:#38b6c1;--ac2:#14313a;--ok:#4cc27a;--wa:#e0a043;--er:#f08a80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
.sub{color:var(--mu);margin:2px 0 18px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.card h2{font-size:15px;margin:0 0 12px;font-weight:800}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
select,input[type=number]{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input[type=range]{width:100%;accent-color:var(--ac)}
.row{display:flex;gap:8px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;font-weight:600}
button:hover:not(:disabled){border-color:var(--ac)}button:disabled{opacity:.45;cursor:not-allowed}
button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.chip{padding:4px 10px;font-size:13px}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:28px 16px;text-align:center;color:var(--mu);cursor:pointer;background:var(--card)}
.drop.over{border-color:var(--ac);background:var(--ac2);color:var(--ac)}
.drop b{color:var(--tx)}
.warn{font-size:13px;color:var(--wa);margin-top:10px}.warn:empty{display:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:10px;margin-top:10px}
.item.sel{border-color:var(--ac)}
.item img{width:64px;height:64px;object-fit:cover;border-radius:6px;background:var(--bg)}
.nm{font-weight:700;word-break:break-all}.mt{color:var(--mu);font-size:13px}
.ok{color:var(--ok)}.er{color:var(--er)}
.bar{height:5px;background:var(--bd);border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .25s}
.cmp{position:relative;margin-top:14px;border-radius:10px;overflow:hidden;background:var(--bg);--p:50%;user-select:none}
.cmp img{display:block;width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.cmp .top{clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.cmp .ln{position:absolute;top:0;bottom:0;left:var(--p);width:2px;background:#fff;box-shadow:0 0 0 1px #0006}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.tag{position:absolute;bottom:8px;background:#000a;color:#fff;font-size:12px;padding:2px 8px;border-radius:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.stats div{background:var(--bg);border-radius:8px;padding:8px 10px}.stats small{display:block;color:var(--mu)}.stats strong{font-size:15px}
.empty{color:var(--mu);text-align:center;padding:24px 0}
</style></head><body><div class="wrap">
<h1>WebImage Optimizer</h1>
<p class="sub">Redimensiona y comprime imágenes para la web. Todo se procesa en tu navegador: nada se sube a ningún servidor.</p>
<div class="grid">
<aside class="card"><h2>Configuración</h2>
<label for="fmt">Formato de salida</label>
<select id="fmt"><option value="image/webp">WebP (recomendado)</option><option value="image/jpeg">JPEG (fotografías)</option><option value="image/png">PNG (transparencia, sin pérdida)</option><option value="image/avif" id="avif">AVIF</option></select>
<label>Perfil de calidad</label>
<div class="chips" id="prof"><button class="chip" data-q="92">Máxima calidad</button><button class="chip on" data-q="80">Equilibrado</button><button class="chip" data-q="60">Archivo ligero</button></div>
<label for="q">Calidad: <span id="qv">80</span></label>
<input type="range" id="q" min="1" max="100" value="80">
<label for="mode">Modo de redimensionado</label>
<select id="mode"><option value="prop">Mantener proporción</option><option value="exact">Dimensiones exactas</option><option value="fit">Ajustar dentro de máximos</option><option value="crop">Recortar a dimensiones exactas</option></select>
<div class="row"><div><label for="w">Ancho (px)</label><input type="number" id="w" min="1" max="16000" placeholder="Auto"></div><div><label for="h">Alto (px)</label><input type="number" id="h" min="1" max="16000" placeholder="Auto"></div></div>
<label style="font-weight:400;display:flex;gap:6px;align-items:center" id="upl"><input type="checkbox" id="up"> Permitir ampliar (solo en “ajustar”)</label>
<label>Anchos habituales</label>
<div class="chips" id="pre"></div>
<div class="warn" id="warn"></div>
<div class="acts"><button class="pri" id="go" disabled>Procesar</button><button id="zip" disabled>Descargar ZIP</button><button id="zipj" disabled>ZIP en .jpg</button><button id="rst">Restablecer</button></div>
</aside>
<main>
<div class="drop" id="drop" tabindex="0" role="button" aria-label="Seleccionar imágenes"><b>Arrastra tus imágenes aquí</b><br>o toca para elegirlas · PNG, JPG, WebP, BMP, GIF, AVIF…<input type="file" id="file" accept="image/*" multiple hidden></div>
<div class="card" style="margin-top:16px"><h2>Imágenes (<span id="cnt">0</span>)</h2><div id="list"><div class="empty">Aún no has añadido imágenes.</div></div>
<div id="cmpbox"></div></div>
</main></div></div>
<script>
const $=s=>document.querySelector(s);
let items=[],sel=null,busy=false,uid=0;
const fmtB=b=>b<1024?b+" B":b<1048576?(b/1024).toFixed(1)+" KB":(b/1048576).toFixed(2)+" MB";
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const EXT={"image/webp":"webp","image/jpeg":"jpg","image/png":"png","image/avif":"avif"};
const NAME={"image/webp":"WebP","image/jpeg":"JPEG","image/png":"PNG","image/avif":"AVIF"};

/* Núcleo de render: se ejecuta en un Web Worker (OffscreenCanvas) o, si no hay soporte, en el hilo principal.
   Reduce por mitades con suavizado de alta calidad y un último paso al tamaño exacto (aproxima Lanczos). */
async function render(bmp,p){
  const mk=(w,h)=>typeof OffscreenCanvas!=="undefined"?new OffscreenCanvas(w,h):Object.assign(document.createElement("canvas"),{width:w,height:h});
  let src=bmp,sx=p.sx,sy=p.sy,sw=p.sw,sh=p.sh;
  while(sw/2>=p.dw&&sh/2>=p.dh){
    const c=mk(Math.round(sw/2),Math.round(sh/2)),x=c.getContext("2d");
    x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";
    x.drawImage(src,sx,sy,sw,sh,0,0,c.width,c.height);
    src=c;sx=0;sy=0;sw=c.width;sh=c.height;
  }
  const c=mk(p.dw,p.dh),x=c.getContext("2d");
  if(p.type==="image/jpeg"){x.fillStyle="#fff";x.fillRect(0,0,p.dw,p.dh)}
  x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";
  x.drawImage(src,sx,sy,sw,sh,0,0,p.dw,p.dh);
  return c.convertToBlob?c.convertToBlob({type:p.type,quality:p.q}):new Promise(r=>c.toBlob(r,p.type,p.q));
}
function runJob(file,p){
  return new Promise(async(res,rej)=>{
    let bmp;try{bmp=await createImageBitmap(file)}catch(e){return rej(new Error("No se pudo leer la imagen. Puede estar dañada o su formato no es compatible con este navegador."))}
    const fallback=async()=>{try{res(await render(bmp,p))}catch(e){rej(e)}};
    try{
      if(typeof OffscreenCanvas==="undefined")return fallback();
      const url=URL.createObjectURL(new Blob([`const render=${render.toString()};onmessage=async e=>{try{postMessage({blob:await render(e.data.bmp,e.data.p)})}catch(err){postMessage({err:String(err)})}}`],{type:"text/javascript"}));
      const w=new Worker(url);
      w.onmessage=e=>{w.terminate();URL.revokeObjectURL(url);e.data.err?rej(new Error(e.data.err)):res(e.data.blob)};
      w.onerror=()=>{w.terminate();URL.revokeObjectURL(url);fallback()};
      w.postMessage({bmp,p},[bmp]);
    }catch(e){fallback()}
  });
}

function settings(){return{type:$("#fmt").value,q:+$("#q").value,mode:$("#mode").value,w:+$("#w").value||0,h:+$("#h").value||0,up:$("#up").checked}}
function calc(it,s){
  const ow=it.ow,oh=it.oh;let w=s.w,h=s.h,dw,dh,sx=0,sy=0,sw=ow,sh=oh;
  if(s.mode==="prop"){if(w){dw=w;dh=Math.round(oh*w/ow)}else if(h){dh=h;dw=Math.round(ow*h/oh)}else{dw=ow;dh=oh}}
  else if(s.mode==="exact"){dw=w||ow;dh=h||oh}
  else if(s.mode==="fit"){let k=Math.min((w||1e9)/ow,(h||1e9)/oh);if(!s.up)k=Math.min(k,1);dw=Math.round(ow*k);dh=Math.round(oh*k)}
  else{dw=w||ow;dh=h||oh;const k=Math.max(dw/ow,dh/oh);sw=dw/k;sh=dh/k;sx=(ow-sw)/2;sy=(oh-sh)/2}
  dw=Math.max(1,dw);dh=Math.max(1,dh);
  return{dw,dh,sx,sy,sw,sh};
}

async function addFiles(fl){
  for(const f of fl){
    const it={id:++uid,file:f,url:URL.createObjectURL(f),st:"idle",pr:0};
    try{const b=await createImageBitmap(f);it.ow=b.width;it.oh=b.height;b.close()}
    catch(e){URL.revokeObjectURL(it.url);it.url=null;it.ow=0;it.oh=0;it.st="error";it.err="Formato no compatible o archivo dañado."}
    items.push(it);
  }
  if(!sel&&items.length)sel=items.find(i=>i.st!=="error")?.id??null;
  draw();warn();
}
async function processAll(){
  if(busy)return;busy=true;draw();
  const s=settings();
  for(const it of items){
    if(it.st==="error"&&!it.url)continue;
    it.st="work";it.pr=15;it.err=null;draw();
    try{
      const d=calc(it,s);
      if(d.dw*d.dh>1e8)throw new Error("Las dimensiones finales son demasiado grandes (máx. ~100 megapíxeles).");
      const same=d.dw===it.ow&&d.dh===it.oh;
      let blob,note="";
      if(s.type==="image/png"&&it.file.type==="image/png"&&same){blob=it.file;note="PNG original conservado sin recomprimir."}
      else{
        blob=await runJob(it.file,{...d,type:s.type,q:s.q/100});
        if(blob.type!==s.type)throw new Error(NAME[s.type]+" no es compatible con este navegador. Elige WebP, JPEG o PNG.");
        if(same&&it.file.type===s.type&&blob.size>=it.file.size){blob=it.file;note="El original ya estaba más optimizado; se conserva."}
      }
      it.pr=80;draw();
      const chk=await createImageBitmap(blob);const ok=chk.width===d.dw&&chk.height===d.dh;chk.close();
      if(!ok)throw new Error("El archivo resultante no coincide con las dimensiones pedidas.");
      if(it.res)URL.revokeObjectURL(it.res.url);
      it.res={blob,url:URL.createObjectURL(blob),w:d.dw,h:d.dh,type:blob.type,q:s.q,note,up:d.dw>it.ow};
      it.st="done";it.pr=100;
    }catch(e){it.st="error";it.err=e.message||"Error al procesar.";it.pr=0}
    draw();
  }
  busy=false;draw();
}
const outName=it=>it.file.name.replace(/\.[^.]+$/,"")+"-"+it.res.w+"x"+it.res.h+"."+(EXT[it.res.type]||"img");
function save(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function toJpg(it){const r=it.res;if(r.type==="image/jpeg")return r.blob;
  const b=await createImageBitmap(r.blob),c=document.createElement("canvas");c.width=r.w;c.height=r.h;
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,r.w,r.h);x.drawImage(b,0,0);b.close();
  return new Promise(res=>c.toBlob(res,"image/jpeg",(r.q||90)/100))}
const jpgName=it=>it.file.name.replace(/\.[^.]+$/,"")+"-"+it.res.w+"x"+it.res.h+".jpg";
async function downloadZipJpg(){
  if(typeof JSZip==="undefined")return alert("No se pudo cargar la biblioteca ZIP. Revisa tu conexión.");
  const z=new JSZip(),used={};
  for(const i of items.filter(i=>i.res)){let n=jpgName(i);const k=used[n]=(used[n]||0)+1;if(k>1)n=n.replace(/\.jpg$/,"-"+k+".jpg");z.file(n,await toJpg(i))}
  save(await z.generateAsync({type:"blob"}),"imagenes-jpg.zip");
}
async function downloadZip(){
  if(typeof JSZip==="undefined")return alert("No se pudo cargar la biblioteca ZIP. Revisa tu conexión.");
  const z=new JSZip(),used={};
  items.filter(i=>i.res).forEach(i=>{let n=outName(i);if(used[n]){n=n.replace(/(\.\w+)$/,"-"+used[n]+"$1");}used[outName(i)]=(used[outName(i)]||0)+1;z.file(n,i.res.blob)});
  save(await z.generateAsync({type:"blob"}),"imagenes-optimizadas.zip");
}

function draw(){
  $("#cnt").textContent=items.length;
  const done=items.some(i=>i.res);
  $("#go").disabled=busy||!items.some(i=>i.url);$("#go").textContent=busy?"Procesando…":"Procesar";
  $("#zip").disabled=!done;$("#zipj").disabled=!done;
  $("#list").innerHTML=items.length?items.map(it=>{
    const r=it.res,red=r?Math.round((1-r.blob.size/it.file.size)*100):0;
    return `<div class="item ${it.id===sel?"sel":""}" data-id="${it.id}">
      ${it.url?`<img src="${it.url}" alt="">`:`<div></div>`}
      <div><div class="nm">${esc(it.file.name)}</div>
      <div class="mt">Original: ${it.ow}×${it.oh} px · ${fmtB(it.file.size)}</div>
      ${r?`<div class="mt">Final: <b>${r.w}×${r.h} px · ${fmtB(r.blob.size)}</b> · <b class="${red>=0?"ok":"er"}">${red>=0?"−"+red:"+"+(-red)}%</b> · ${NAME[r.type]||r.type}${r.type==="image/png"?"":" · calidad "+r.q}</div>
      <div class="mt ok">✓ Verificado: ${r.w}×${r.h} px, ${NAME[r.type]||r.type}${r.note?" · "+esc(r.note):""}</div>`:""}
      ${it.err?`<div class="mt er">${esc(it.err)}</div>`:""}
      <div class="bar"><i style="width:${it.pr}%"></i></div></div>
      <div>${r?`<button data-dl="${it.id}">Descargar</button> <button data-jpg="${it.id}">Descargar .jpg</button>`:""}</div></div>`}).join(""):`<div class="empty">Aún no has añadidas imágenes.</div>`.replace("añadidas","añadido");
  drawCmp();
}
function drawCmp(){
  const it=items.find(i=>i.id===sel);
  if(!it||!it.res){$("#cmpbox").innerHTML="";return}
  const r=it.res,red=Math.round((1-r.blob.size/it.file.size)*100);
  $("#cmpbox").innerHTML=`<div class="cmp" id="cmp" style="aspect-ratio:${r.w}/${r.h};max-height:520px;margin-inline:auto">
    <img src="${r.url}" alt="Resultado"><img class="top" src="${it.url}" alt="Original">
    <span class="tag" style="left:8px">Original</span><span class="tag" style="right:8px">Resultado</span>
    <div class="ln"></div><input type="range" min="0" max="100" value="50" aria-label="Comparar original y resultado"></div>
    <div class="stats"><div><small>Resolución</small><strong>${it.ow}×${it.oh} → ${r.w}×${r.h}</strong></div>
    <div><small>Peso</small><strong>${fmtB(it.file.size)} → ${fmtB(r.blob.size)}</strong></div>
    <div><small>Reducción</small><strong>${red>=0?"−"+red:"+"+(-red)}%</strong></div>
    <div><small>Formato · calidad</small><strong>${NAME[r.type]}${r.type==="image/png"?"":" · "+r.q}</strong></div></div>
    ${r.up?`<div class="warn">Esta imagen se amplió: ampliar no recupera detalles perdidos.</div>`:""}`;
  const c=$("#cmp");c.querySelector("input").oninput=e=>c.style.setProperty("--p",e.target.value+"%");
}
function warn(){
  const s=settings(),m=[];
  if(s.type==="image/png")m.push("PNG no usa ajuste de calidad y puede pesar más que WebP o JPEG. Si no cambias el tamaño, no se recomprime.");
  if(s.type==="image/jpeg")m.push("JPEG no admite transparencia: se rellenará con fondo blanco.");
  if(items.some(i=>i.ow&&((s.w&&s.w>i.ow&&s.mode!=="fit")||(s.h&&s.h>i.oh&&s.mode!=="fit")||(s.mode==="fit"&&s.up&&((s.w&&s.w>i.ow)||(s.h&&s.h>i.oh))))))m.push("Vas a ampliar al menos una imagen: ampliar no recupera detalles perdidos.");
  $("#warn").innerHTML=m.map(esc).join("<br>");
  $("#upl").style.display=s.mode==="fit"?"flex":"none";
  $("#qv").textContent=s.q;$("#q").disabled=s.type==="image/png";
}

/* Eventos */
$("#pre").innerHTML=[320,640,800,1200,1600,1920].map(n=>`<button class="chip" data-w="${n}">${n}</button>`).join("");
$("#pre").onclick=e=>{const n=e.target.dataset.w;if(!n)return;$("#w").value=n;if($("#mode").value==="prop")$("#h").value="";warn()};
$("#prof").onclick=e=>{const q=e.target.dataset.q;if(!q)return;$("#q").value=q;[...$("#prof").children].forEach(b=>b.classList.toggle("on",b===e.target));warn()};
$("#q").oninput=()=>{[...$("#prof").children].forEach(b=>b.classList.toggle("on",b.dataset.q===$("#q").value));warn()};
["#fmt","#mode","#w","#h","#up"].forEach(s=>$(s).addEventListener("input",warn));
$("#mode").addEventListener("change",()=>{if($("#mode").value==="prop")$("#h").value=""});
$("#go").onclick=processAll;$("#zip").onclick=downloadZip;$("#zipj").onclick=downloadZipJpg;
$("#rst").onclick=()=>{items.forEach(i=>{i.url&&URL.revokeObjectURL(i.url);i.res&&URL.revokeObjectURL(i.res.url)});items=[];sel=null;$("#w").value="";$("#h").value="";$("#file").value="";draw();warn()};
$("#list").onclick=e=>{
  const j=e.target.dataset.jpg;if(j){const it=items.find(i=>i.id==j);return toJpg(it).then(b=>save(b,jpgName(it)))}
  const d=e.target.dataset.dl;if(d){const it=items.find(i=>i.id==d);return save(it.res.blob,outName(it))}
  const el=e.target.closest(".item");if(el){sel=+el.dataset.id;draw()}
};
const dz=$("#drop");
dz.onclick=()=>$("#file").click();dz.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("#file").click()}};
$("#file").onchange=e=>addFiles([...e.target.files].filter(f=>f.type.startsWith("image/")||/\.(bmp|avif|heic)$/i.test(f.name)));
["dragenter","dragover"].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add("over")}));
["dragleave","drop"].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove("over")}));
dz.addEventListener("drop",e=>addFiles([...e.dataTransfer.files].filter(f=>f.type.startsWith("image/"))));
try{const t=document.createElement("canvas");t.width=t.height=1;if(!t.toDataURL("image/avif").startsWith("data:image/avif")){$("#avif").disabled=true;$("#avif").textContent="AVIF (no disponible en este navegador)"}}catch(e){$("#avif").disabled=true}
warn();
</script></body></html>
